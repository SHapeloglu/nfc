name: Laravel tests

on:
  pull_request:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate an ephemeral application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-interaction)" >> "$GITHUB_ENV"

      - name: Run Laravel test suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --compact
